[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Alexandre Guimarães Malucelli"]
repository = "https://github.com/amalucelli/dffy"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
let_underscore_drop = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# The duplicates are transitive and can't be unified from here: syn 2 and 3
# (gix's and clap's proc macros), bitflags 1 and 2 (portable-pty, a
# dev-dependency) and defmt (gix's faster-hex). Cargo has no `expect` level.
multiple_crate_versions = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
panic = "warn"
expect_used = "warn"
exit = "warn"
mem_forget = "warn"
rc_mutex = "warn"
clone_on_ref_ptr = "warn"
str_to_string = "warn"
rest_pat_in_fully_bound_structs = "warn"
use_self = "warn"
redundant_clone = "warn"
or_fun_call = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
