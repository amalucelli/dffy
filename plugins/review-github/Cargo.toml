[package]
name = "dffy-review-github"
description = "An experimental dffy review plugin that reviews GitHub pull requests in dffy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["diff", "github", "review", "terminal", "dffy"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

# No benchmarks: `cargo bench` builds it as a harness without the tests,
# where the tests' `tempfile` would warn as unused.
[[bin]]
name = "dffy-review-github"
path = "src/main.rs"
bench = false

[dependencies]
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
