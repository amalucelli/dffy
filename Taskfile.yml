version: "3"

tasks:
  setup:
    desc: Install the dev tools used by the other tasks
    cmds:
      - task: setup:binstall
      - cargo binstall -y cargo-nextest cargo-deny taplo-cli typos-cli cargo-machete

  setup:binstall:
    internal: true
    status:
      - command -v cargo-binstall
    cmds:
      - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

  fmt:
    desc: Format Rust and TOML
    cmds:
      - cargo fmt --all
      - taplo fmt

  fmt:check:
    desc: Check Rust and TOML formatting
    cmds:
      - cargo fmt --all --check
      - taplo fmt --check

  lint:
    desc: Run clippy on all targets, warnings are errors
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    desc: Run tests with nextest, then doctests
    cmds:
      - cargo nextest run --workspace --no-tests=pass
      - cargo test --workspace --doc

  test:kernel:
    desc: Run the tests against the Linux kernel clone in DFFY_BENCH_REPO
    requires:
      vars: [DFFY_BENCH_REPO]
    env:
      DFFY_BENCH_REPO: "{{.DFFY_BENCH_REPO}}"
    cmds:
      # Release only: the syntax diff's parse budget is wall-clock, and a debug
      # build misses it on the 1.1MB generated table.
      - cargo nextest run --release --workspace --test kernel --test watch --no-tests=pass

  doc:
    desc: Build docs, warnings are errors
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo doc --workspace --no-deps

  deny:
    desc: Check advisories, licenses, bans and sources
    cmds:
      - cargo deny check

  machete:
    desc: Find unused dependencies
    cmds:
      - cargo machete

  typos:
    desc: Spell-check the tree
    cmds:
      - typos

  bench:
    desc: Run benchmarks; they need DFFY_BENCH_REPO pointing at the kernel clone and skip without it
    cmds:
      - cargo bench --workspace

  bench:compare:
    desc: Time dffy, built from the checkout, against other diff tools on the kernel range, for the tables in docs/benchmarks.md; results in target/perf/runs
    requires:
      vars: [DFFY_BENCH_REPO]
    env:
      DFFY_BENCH_REPO: "{{.DFFY_BENCH_REPO}}"
      DFFY: '{{.DFFY | default "target/release/dffy"}}'
    cmds:
      - cargo build --release -p dffy
      - cargo xtask compare

  # The perf tasks measure the checkout against a build of a revision
  # (default HEAD~1) and only print and save results in target/perf/runs.
  # Arguments after `--` go to `cargo xtask perf`.
  perf:
    desc: "Timing, instructions and allocations of the checkout against a revision, every group unless --only narrows it, e.g. task perf -- --rev main --only frame,print"
    requires:
      vars: [DFFY_BENCH_REPO]
    env:
      DFFY_BENCH_REPO: "{{.DFFY_BENCH_REPO}}"
    cmds:
      - cargo xtask perf {{.CLI_ARGS}}

  perf:quick:
    desc: "Instruction and allocation counts of the checkout against a revision, every group; Linux only. e.g. task perf:quick -- --rev main"
    requires:
      vars: [DFFY_BENCH_REPO]
    env:
      DFFY_BENCH_REPO: "{{.DFFY_BENCH_REPO}}"
    cmds:
      - cargo xtask perf --quick {{.CLI_ARGS}}

  perf:full:
    desc: "Every group of the checkout against a revision, measuring layout bands when missing or more than 30 days old. e.g. task perf:full -- --rev main"
    requires:
      vars: [DFFY_BENCH_REPO]
    env:
      DFFY_BENCH_REPO: "{{.DFFY_BENCH_REPO}}"
    cmds:
      - cargo xtask perf --full {{.CLI_ARGS}}

  build:
    desc: Build the release binary
    cmds:
      - cargo build --release --workspace

  man:
    desc: Write the man page to target/dffy.1
    cmds:
      - mkdir -p target
      - cargo run -q --release -p dffy -- man > target/dffy.1

  docs:
    desc: Regenerate docs/keys.md and the settings table in docs/config.md
    cmds:
      - task: docs:generate
        vars: { OUT: docs }

  docs:check:
    desc: Fail when docs/keys.md or docs/config.md differ from what task docs writes
    vars:
      OUT:
        sh: mktemp -d
    cmds:
      - defer: rm -rf "{{.OUT}}"
      - task: docs:generate
        vars: { OUT: "{{.OUT}}" }
      - diff -u docs/keys.md "{{.OUT}}/keys.md"
      - diff -u docs/config.md "{{.OUT}}/config.md"

  docs:generate:
    internal: true
    requires:
      vars: [OUT]
    cmds:
      - defer: rm -f "{{.OUT}}/keys.md.new" "{{.OUT}}/config.section.md" "{{.OUT}}/config.md.new"
      - cargo run -q -p dffy -- config --markdown keys > "{{.OUT}}/keys.md.new"
      - cargo run -q -p dffy -- config --markdown config > "{{.OUT}}/config.section.md"
      # The section carries both markers, so it replaces the lines from the
      # first marker to the second; a docs/config.md without them fails.
      - >-
        awk -v section="{{.OUT}}/config.section.md"
        '/^<!-- generated by task docs/ { while ((getline line < section) > 0) print line; found = 1; skip = 1; next }
        skip && /^<!-- end of generated section -->/ { skip = 0; next }
        !skip { print }
        END { exit !found }'
        docs/config.md > "{{.OUT}}/config.md.new"
      - mv "{{.OUT}}/keys.md.new" "{{.OUT}}/keys.md"
      - mv "{{.OUT}}/config.md.new" "{{.OUT}}/config.md"
      - rm "{{.OUT}}/config.section.md"

  install:
    desc: Install dffy to ~/.local/bin
    cmds:
      - cargo install --path crates/dffy --root ~/.local

  install:plugins:
    desc: Install the experimental plugins (dffy-render-markdown, dffy-render-mermaid, dffy-review-github) to ~/.local/bin
    cmds:
      - cargo install --path plugins/markdown --root ~/.local
      - cargo install --path plugins/mermaid --root ~/.local
      - cargo install --path plugins/review-github --root ~/.local

  snapshot:
    desc: Build the release artifacts locally without tagging or publishing
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  bump:
    desc: Set the release version in every Cargo.toml and Cargo.lock, e.g. task bump VERSION=0.3.0
    requires:
      vars: [VERSION]
    cmds:
      - cargo xtask bump {{.VERSION}}

  release:
    desc: Tag and publish a release, e.g. task release TAG=v0.1.0
    requires:
      vars: [TAG]
    preconditions:
      # `dffy --version` comes from dffy's Cargo version and the disk cache
      # keys from dffy-core's, so both must match the tag.
      - sh: test "v$(cargo pkgid -p dffy | sed 's/.*[#@]//')" = "{{.TAG}}"
        msg: "{{.TAG}} doesn't match dffy's version in Cargo.toml; bump it first"
      - sh: test "v$(cargo pkgid -p dffy-core | sed 's/.*[#@]//')" = "{{.TAG}}"
        msg: "{{.TAG}} doesn't match dffy-core's version in crates/dffy-core/Cargo.toml; bump it first"
    env:
      GITHUB_TOKEN:
        sh: gh auth token
    cmds:
      # goreleaser reads the tag from the remote, so it has to be pushed first.
      - git tag -s {{.TAG}} -m {{.TAG}}
      - git push --follow-tags
      - goreleaser release --clean

  # Sequential on purpose: `deps:` would run these in parallel.
  ci:
    desc: Everything CI runs, in order
    cmds:
      - task: fmt:check
      - task: lint
      - task: test
      # After test, which builds the binary it runs.
      - task: docs:check
      - task: doc
      - task: deny
      - task: machete
      - task: typos
