<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="dffy">
  <defs>
    <!-- The whole icon is the face, split at the seam like Finder's. -->
    <path id="squircle" d="M182 32H330C440 32 480 72 480 182V330C480 440 440 480 330 480H182C72 480 32 440 32 330V182C32 72 72 32 182 32Z"/>
    <path id="smile" d="M132 258C170 340 342 340 380 258" fill="none" stroke="#1d1433" stroke-width="40" stroke-linecap="round"/>
    <clipPath id="inside"><use href="#squircle"/></clipPath>
    <clipPath id="old-side"><rect width="256" height="512"/></clipPath>
    <clipPath id="new-side"><rect x="256" width="256" height="512"/></clipPath>
    <linearGradient id="old-fill" gradientUnits="userSpaceOnUse" x1="120" y1="32" x2="230" y2="480">
      <stop offset="0" stop-color="#ffb08a"/>
      <stop offset="0.5" stop-color="#ff7479"/>
      <stop offset="1" stop-color="#f23d7b"/>
    </linearGradient>
    <linearGradient id="new-fill" gradientUnits="userSpaceOnUse" x1="392" y1="32" x2="282" y2="480">
      <stop offset="0" stop-color="#c2f99e"/>
      <stop offset="0.5" stop-color="#55e4a6"/>
      <stop offset="1" stop-color="#0dbd96"/>
    </linearGradient>
    <radialGradient id="warm" gradientUnits="userSpaceOnUse" cx="120" cy="70" r="240">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff4d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" gradientUnits="userSpaceOnUse" cx="392" cy="70" r="240">
      <stop offset="0" stop-color="#effff6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#effff6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a0f3c" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <use href="#squircle" y="8" fill="#3a1030" opacity="0.28" filter="url(#soft)"/>

  <g clip-path="url(#inside)">
    <g clip-path="url(#old-side)">
      <rect width="512" height="512" fill="url(#old-fill)"/>
      <rect width="512" height="512" fill="url(#warm)"/>
      <use href="#smile"/>
    </g>
    <rect x="130" y="172" width="96" height="38" rx="19" fill="#1d1433"/>

    <g clip-path="url(#new-side)">
      <rect width="512" height="512" fill="url(#new-fill)"/>
      <rect width="512" height="512" fill="url(#cool)"/>
      <!-- The diff: the new side's features sit one step lower, so the smile hops at the seam. -->
      <g transform="translate(0 22)">
        <use href="#smile"/>
        <path d="M334 162V220M305 191H363" fill="none" stroke="#1d1433" stroke-width="38" stroke-linecap="round"/>
      </g>
    </g>

    <use href="#squircle" fill="none" stroke="url(#rim)" stroke-width="8"/>
  </g>
</svg>
