[package]
name = "dffy"
description = "A fast terminal diff viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["diff", "git", "terminal", "tui", "pager"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "string", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
dffy-core = { version = "0.5.0", path = "../dffy-core" }
pulldown-cmark = { version = "0.13.6", default-features = false }
rustix = { version = "1.1.6", features = ["termios", "fs", "event", "net", "pipe", "process"] }
signal-hook = "0.4.6"
unicode-width = "0.2.3"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.28.0", default-features = false, features = ["event", "socket", "user"] }

[dev-dependencies]
divan = "0.1.21"
insta = "1.49.0"
portable-pty = "0.9.0"
proptest = "1.12.0"
tempfile = "3.27.0"
vt100 = "0.18.1"

[[bench]]
name = "frame"
harness = false
